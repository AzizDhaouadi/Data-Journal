name: Review Markdown & MDX
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.mdx'

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Prose Review
        uses: anthropics/claude-code-base-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools Bash,Write"
          prompt: |
            Review only the Markdown and MDX files changed in this PR for clarity,
            grammar, structure, and technical depth. Run:
            git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.md' '*.mdx'
            to find changed files, then review each one. Write your complete findings
            to /tmp/review.md, one section per file. Be concise and actionable.

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('/tmp/review.md', 'utf8');
            } catch (e) {
              body = 'Claude review did not produce output.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude Prose Review\n\n${body}`
            });
